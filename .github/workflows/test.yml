name: Tests

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Static lint: no source-grep tests in the test suite.
  # Runs once (not per matrix node version) since it is a file-content check.
  lint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
      - name: Lint — no source-grep tests
        shell: bash
        run: node scripts/lint-no-source-grep.cjs
      - name: Lint — command contract (ADR-0002)
        shell: bash
        run: node scripts/lint-command-contract.cjs

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
        include:
          # Single macOS runner — verifies platform compatibility on the standard version
          - os: macos-latest
            node-version: 24
          # Windows path/separator coverage is handled by hardcoded-paths.test.cjs
          # and windows-robustness.test.cjs (static analysis, runs on all platforms).
          # A dedicated windows-compat workflow runs on a weekly schedule.

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Fetch full history so we can merge origin/main for stale-base detection.
          fetch-depth: 0

      # GitHub's `refs/pull/N/merge` is cached against the recorded merge-base.
      # When main advances after a PR is opened, the cache stays stale and CI
      # runs against the pre-advance state — hiding bugs that are already fixed
      # on trunk and surfacing type errors that were introduced and then patched
      # on main in between. Explicitly merge current origin/main here so tests
      # always run against the latest trunk.
      - name: Rebase check — merge origin/main into PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "ci@gsd-build"
          git config user.name "CI Rebase Check"
          git fetch origin main
          if ! git merge --no-edit --no-ff origin/main; then
            echo "::error::This PR cannot cleanly merge origin/main. Rebase your branch onto current main and push again."
            echo "::error::Conflicting files:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Phase 7 / Plan 07-04a — bd install (D-03).
      # bd release org confirmed via checkpoint:decision: gastownhall (Assumption A1 resolved).
      # Exact release asset: beads_1.0.4_linux_amd64.tar.gz
      # Verified URL: https://github.com/gastownhall/beads/releases/download/v1.0.4/beads_1.0.4_linux_amd64.tar.gz
      - name: Install bd (Linux release tarball)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BD_VERSION=1.0.4
          BD_URL="https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl -fL -o /tmp/bd.tar.gz "$BD_URL"
          sudo tar -xzf /tmp/bd.tar.gz -C /usr/local/bin
          bd --version  # CI gate: fails job if install botched

      - name: Install bd (macOS Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install beads || brew upgrade beads
          bd --version

      # Checkout sibling gsd-beads BEFORE npm ci so file:../gsd-beads resolves.
      # actions/checkout refuses paths outside $GITHUB_WORKSPACE, so check out to a
      # workspace-nested path then copy to ../gsd-beads to match the local-dev layout
      # that file:../gsd-beads in fork's package.json expects.
      - name: Checkout sibling gsd-beads (workspace-nested)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: elliottabirch/gsd-beads
          path: .gsd-beads-checkout
          ref: main

      - name: Relocate sibling to ../gsd-beads (match file:../gsd-beads devDep)
        shell: bash
        run: |
          set -euo pipefail
          cp -r .gsd-beads-checkout ../gsd-beads
          rm -rf .gsd-beads-checkout

      - name: Build sibling gsd-beads
        working-directory: ../gsd-beads
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build SDK dist (required by installer)
        run: npm run build:sdk

      # Seam contract gate: keep manifest -> generated aliases -> registry/CJS adapters aligned.
      # Run once per workflow on the primary Linux node to avoid redundant matrix cost.
      - name: SDK seam coverage tests
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        shell: bash
        run: cd sdk && npx vitest run src/query/command-seam-coverage.test.ts

      - name: SDK generated alias artifact drift check
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        shell: bash
        run: node sdk/scripts/check-command-aliases-fresh.mjs

      - name: Run tests with coverage
        shell: bash
        run: npm run test:coverage

      # Phase 7 / Plan 07-04a — paired conformance (D-01).
      # Runs on one matrix slot to keep CI time bounded (~30-60s extra).
      # bd is installed above; describe.skip path never triggers here.
      - name: Run paired conformance
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        shell: bash
        run: npm run test:conformance:paired
